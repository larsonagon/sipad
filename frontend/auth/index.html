<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIPAD – Sistema inteligente para la planeación archivística documental</title>

<!-- CSS LOGIN -->
<link rel="stylesheet" href="/auth/index.css">

<!-- CSS GLOBAL SIPAD -->
<link rel="stylesheet" href="/css/core/sipad-ui.css">

  <!-- SIPAD-PWA -->
  <meta name="theme-color" content="#0E4A57">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SIPAD">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="/css/core/mobile.css">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
      });
    }
  </script>
  <!-- /SIPAD-PWA -->
</head>

<body>

<!-- ========================= -->
<!-- CONTENIDO LOGIN -->
<!-- ========================= -->

<div class="login-page">

  <div class="login-wrapper">

    <div class="login-brand">
      <h1>SIPAD</h1>
      <span>Sistema inteligente para la planeación archivística documental</span>
    </div>

    <div class="login-card">

      <h2 class="login-title">Ingreso al sistema</h2>

      <form id="loginForm">

        <div class="login-field">
          <input
            type="text"
            id="usuario"
            placeholder="Usuario"
            autocomplete="username"
            required>
        </div>

        <div class="login-field">
          <input
            type="password"
            id="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            required>
        </div>

        <button type="submit" class="login-button">
          Ingresar
        </button>

        <div id="mensaje" class="login-message"></div>

      </form>

    </div>

  </div>

</div>

<!-- ========================= -->
<!-- FOOTER (MANUAL Y CORRECTO) -->
<!-- ========================= -->

<footer class="sipad-footer">
  <div class="sipad-footer-inner">
    <span>SIPAD – Sistema inteligente para la planeación archivística documental</span>
    <span class="sipad-dev">© 2026 · Desarrollado por Larson Agón</span>
  </div>
</footer>

<!-- ========================= -->
<!-- JS LOGIN -->
<!-- ========================= -->

<script src="/auth/index.js" defer></script>
<script src="/components/password-modal.js" defer></script>

</body>
</html>
