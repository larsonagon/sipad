<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de valoración – SIPAD</title>
  <link rel="stylesheet" href="/css/core/sipad-ui.css">
  <style>
    .fv-sec{border:1px solid var(--color-border);border-radius:12px;margin-top:1.1rem;background:#fff;overflow:hidden;}
    .fv-sec>h3{margin:0;padding:12px 16px;background:var(--color-bg-soft,#f9fafb);font-size:14px;
      text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-muted);border-bottom:1px solid var(--color-border);}
    .fv-body{padding:16px;}
    .fv-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .fv-field label{display:block;font-weight:600;font-size:13px;margin-bottom:4px;}
    .fv-field textarea,.fv-field input,.fv-field select{width:100%;box-sizing:border-box;}
    .fv-val{display:grid;grid-template-columns:180px 130px 1fr;gap:10px;align-items:center;margin-bottom:8px;}
    .fv-val .vname{font-weight:600;font-size:13px;}
    .fv-val .vname small{display:block;font-weight:400;color:var(--color-text-muted);font-size:11px;}
    .muted{color:var(--color-text-muted);font-size:13px;}
    .hidden{display:none;}
    .fv-list-item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--color-border);
      border-radius:10px;padding:12px 14px;margin-bottom:8px;background:#fff;}
    .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#eef2ff;color:#3730a3;}
    .tag.ct{background:#e7f7ef;color:#0f8a5f}.tag.e{background:#fee2e2;color:#991b1b}
    .tag.s{background:#fff7ed;color:#b45309}.tag.m{background:#eef6f9;color:#0e7490}
    .save-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--color-border);
      padding:12px 0;display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px;}
    .chk{display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-weight:400;font-size:13px;}
  </style>
</head>
<body>
  <div id="header"></div>
  <main class="module-page">
    <div class="contenido-documento">

      <div class="module-header centered">
        <h1>Ficha de valoración documental</h1>
        <p class="module-subtext">Valores, ciclo vital, hecho de cierre y disposición final por serie/subserie</p>
      </div>

      <!-- LISTA -->
      <section id="vistaLista">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
          <h3 style="margin:0;">Fichas</h3>
          <div style="display:flex;gap:8px;">
            <button class="btn-secondary" id="btnDesdePropuesta">+ Desde propuesta TRD-AI</button>
            <button class="btn-primary" id="btnNueva">+ Nueva ficha (manual)</button>
          </div>
        </div>
        <p class="muted" style="margin:4px 0 0;">Lo recomendado: parte de una <b>serie/subserie propuesta por TRD-AI</b> y valórala.</p>
        <div id="lista" style="margin-top:1rem;"></div>
      </section>

      <!-- FORMULARIO -->
      <section id="vistaForm" class="hidden">
        <button class="btn-secondary" id="btnVolver" style="margin-bottom:.6rem;">← Volver</button>
        <div id="form"></div>
      </section>

    </div>
  </main>
  <script type="module" src="/valoracion/ficha.js"></script>
  <script src="/components/password-modal.js"></script>
</body>
</html>
