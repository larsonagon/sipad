<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roles | SIPAD</title>

<link rel="stylesheet" href="/css/core/sipad-ui.css">
<link rel="stylesheet" href="/css/modules/admin.css">

  <!-- SIPAD-PWA -->
  <meta name="theme-color" content="#0E4A57">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SIPAD">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="/css/core/mobile.css">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
      });
    }
  </script>
  <!-- /SIPAD-PWA -->
</head>

<body>

<div id="header"></div>

<main class="module-page">

<!-- HEADER -->

<div class="module-header centered">
  <h1>Gestión de roles</h1>
  <p>Definición de permisos funcionales del sistema.</p>
</div>

<!-- TOOLBAR -->

<section class="section-actions">

  <div class="actions-left">
    <button id="btnNuevo" class="btn-primary">
      + Nuevo Rol
    </button>
  </div>

  <!-- 🔥 Eliminado buscador completamente -->

</section>

<!-- TABLA -->

<section class="table-wrapper">

  <div class="table-container-centered">

    <table id="tablaRoles" class="table">

      <thead>
        <tr>
          <th style="width:80px;">ID</th>
          <th>Nombre</th>
          <th>Nivel</th>
        </tr>
      </thead>

      <tbody></tbody>

    </table>

  </div>

</section>

</main>

<!-- MODAL -->

<div id="modal" class="modal hidden">

  <div class="modal-content">

    <h3 id="modalTitle">Nuevo Rol</h3>

    <form id="formRol" autocomplete="off">

      <div class="form-group">
        <label>Nombre</label>
        <input
          type="text"
          id="inputNombre"
          placeholder="Ej: Administrador TRD"
          required
        >
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea
          id="inputDescripcion"
          placeholder="Descripción funcional del rol dentro del sistema"
        ></textarea>
      </div>

      <div class="modal-actions">

        <button
          type="button"
          id="btnCancelar"
          class="btn-secondary"
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="btn-primary"
        >
          Guardar
        </button>

      </div>

    </form>

  </div>

</div>

<script type="module" src="./roles.js"></script>
<script src="/components/password-modal.js"></script>
<script type="module" src="/components/notifications.js"></script>

</body>
</html>
