<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dependencias | SIPAD</title>

<link rel="stylesheet" href="/css/core/sipad-ui.css">
<link rel="stylesheet" href="/css/modules/admin.css">

  <!-- SIPAD-PWA -->
  <meta name="theme-color" content="#0E4A57">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SIPAD">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="/css/core/mobile.css">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
      });
    }
  </script>
  <!-- /SIPAD-PWA -->
</head>

<body>

<div id="header"></div>

<main class="module-page">

<!-- HEADER -->

<div class="module-header centered">
<h1>Gestión de dependencias u oficinas</h1>
<p>Administración de la estructura organizacional institucional.</p>
</div>



<!-- TOOLBAR -->

<section class="section-actions">

<div class="actions-left">

<button
id="btnNueva"
class="btn-primary"
type="button"
>
+ Nueva Dependencia
</button>

</div>


<div class="actions-right">

<input
type="text"
id="inputBuscarDependencia"
class="input-search"
placeholder="Buscar dependencia"
autocomplete="off"
>

</div>

</section>



<!-- TABLA -->

<section>

<table id="tablaDependencias" class="table">

<thead>

<tr>

<th style="width:80px;">ID</th>
<th>Nombre</th>
<th style="width:130px;">Estado</th>
<th style="width:160px;">Fecha de registro</th>
<th style="width:80px;">Acciones</th>

</tr>

</thead>

<tbody></tbody>

</table>

</section>

</main>



<!-- MODAL DEPENDENCIA -->

<div
id="modalDependencia"
class="modal hidden"
role="dialog"
aria-modal="true"
aria-hidden="true"
>

<div
class="modal-content"
role="document"
tabindex="-1"
>

<h3 id="modalTitle">Nueva Dependencia</h3>

<form id="formDependencia" autocomplete="off">

<div class="form-group">

<label for="inputNombre">Nombre</label>

<input
type="text"
id="inputNombre"
name="nombre"
placeholder="Nombre de la dependencia u oficina"
required
>

</div>



<div class="modal-actions">

<button
type="button"
id="btnCancelar"
class="btn-secondary"
>
Cancelar
</button>

<button
type="submit"
id="btnGuardar"
class="btn-primary"
>
Guardar
</button>

</div>

</form>

</div>

</div>



<script type="module" src="./dependencias.js"></script>

<!-- SCRIPT GLOBAL CAMBIAR PASSWORD -->
<script src="/components/password-modal.js"></script>
<script type="module" src="/components/notifications.js"></script>

</body>
</html>
