<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRD-AI – Dashboard</title>

<link rel="stylesheet" href="/css/core/sipad-ui.css">

<style>

/* KPI CARDS */

.trd-kpis{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.trd-card{
background:white;
padding:22px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.trd-card-title{
font-size:13px;
color:#777;
margin-bottom:8px;
}

.trd-card-value{
font-size:32px;
font-weight:700;
color:#2c3e50;
}

/* CTA */

.trd-actions{
margin:20px 0 30px 0;
display:flex;
gap:10px;
}

/* TABLA */

.trd-table{
width:100%;
border-collapse:collapse;
}

.trd-table th{
text-align:left;
padding:12px;
border-bottom:2px solid #e5e5e5;
}

.trd-table td{
padding:12px;
border-bottom:1px solid #f0f0f0;
}

</style>

  <!-- SIPAD-PWA -->
  <meta name="theme-color" content="#0E4A57">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SIPAD">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="/css/core/mobile.css">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
      });
    }
  </script>
  <!-- /SIPAD-PWA -->
</head>

<body>

<div id="header"></div>

<main class="module-page">

<div class="module-header premium-header">

<h1>TRD-AI</h1>

<p class="module-subtext">
Motor inteligente para generación asistida de Tablas de Retención Documental.
</p>

</div>


<div class="module-content">

<div class="trd-actions">

<button id="btnVerPropuestas" class="btn-primary">
Ver propuestas
</button>

</div>


<div class="trd-kpis">

<div class="trd-card">
<div class="trd-card-title">Total propuestas</div>
<div id="kpiTotal" class="trd-card-value">0</div>
</div>

<div class="trd-card">
<div class="trd-card-title">Aprobadas</div>
<div id="kpiAprobadas" class="trd-card-value">0</div>
</div>

<div class="trd-card">
<div class="trd-card-title">Rechazadas</div>
<div id="kpiRechazadas" class="trd-card-value">0</div>
</div>

<div class="trd-card">
<div class="trd-card-title">Pendientes</div>
<div id="kpiPendientes" class="trd-card-value">0</div>
</div>

</div>

<!-- Panel de preparación para el comité (se llena por JS) -->
<div id="preparacionComite"></div>


<div class="recientes-card" style="max-width:520px;margin-top:8px;background:#fff;border:1px solid #e6eaf0;border-radius:12px;box-shadow:0 1px 2px rgba(16,42,73,.06),0 4px 14px rgba(16,42,73,.04);overflow:hidden;">
<div style="padding:12px 16px;border-bottom:1px solid #eef1f6;font-size:13px;font-weight:700;color:#0f172a;">Series aprobadas recientemente</div>
<div id="tablaRecientes"></div>
</div>

</div>

</main>


<!-- ===================================== -->
<!-- MODAL CAMBIAR PASSWORD (GLOBAL) -->
<!-- ===================================== -->

<div id="modalPassword" class="modal hidden">

<div class="modal-content small">

<h3>Cambiar contraseña</h3>

<form id="formCambiarPassword">

<div class="form-group">
<label>Contraseña actual</label>
<input type="password" id="passwordActual" required>
</div>

<div class="form-group">
<label>Nueva contraseña</label>
<input type="password" id="passwordNueva" required>
</div>

<div class="form-group">
<label>Confirmar nueva contraseña</label>
<input type="password" id="passwordConfirmar" required>
</div>

<div class="modal-actions">

<button
type="button"
id="btnCancelarPassword"
class="btn-secondary">
Cancelar
</button>

<button
type="submit"
class="btn-primary">
Actualizar contraseña
</button>

</div>

</form>

</div>

</div>


<script type="module" src="/trd-ai/trd-ai-dashboard.js"></script>
<script type="module" src="/trd-ai/trd-ai-preparacion.js"></script>
<script src="/components/password-modal.js"></script>

</body>
</html>
