<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRD-AI – Propuestas</title>

<link rel="stylesheet" href="/css/core/sipad-ui.css">
<link rel="stylesheet" href="/css/core/notifications.css">

<style>

.module-page { max-width: 1400px !important; }

/* ── Tabla ── */
.trd-table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  font-size: 13px;
}

.trd-table th {
  text-align: left;
  padding: 11px 14px;
  border-bottom: 2px solid #e6e6e6;
  border-right: none;
  border-left: none;
  font-weight: 600;
  font-size: 12px;
  color: #555;
  letter-spacing: .2px;
  white-space: nowrap;
}

.trd-table td {
  padding: 13px 14px;
  border-bottom: 1px solid #eef0f3;
  border-right: none;
  border-left: none;
  vertical-align: top;
}

/* Cebra sutil + hover para legibilidad */
.trd-table tbody tr:nth-child(even) td { background: #fbfcfe; }
.trd-table tr:hover td { background: #f2f6ff; }

/* ── Columnas ── */
.col-serie    { width: 150px; min-width: 130px; }
.col-subserie { width: 200px; min-width: 170px; max-width: 230px; }

/* Limitar textos largos a 2 líneas con puntos suspensivos (texto completo en el tooltip) */
.clamp2 {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}
.subserie .clamp2 { text-transform: none; }
.col-cantidad { width: 50px;  text-align: center; }
.col-tipos    { min-width: 260px; }
.col-estado   { width: 120px; text-align: center; }
.col-acciones { width: 230px; min-width: 230px; }

/* La celda de estado del cuerpo debe igualar la cabecera:
   mismo ancho, centrada y alineada verticalmente al medio.
   (Antes el <td> usaba la clase td-estado sin definir → descuadre.) */
.td-estado {
  width: 120px;
  text-align: center;
  vertical-align: middle;
}
.col-cantidad { vertical-align: middle; }
/* Los botones de acción, centrados verticalmente para quedar a la
   misma altura que el chip de estado en cada fila. */
.trd-actions { vertical-align: middle; }

/* ── Serie ── */
.serie-nombre { font-size: 13px; font-weight: 700; color: #2c3e50; }

/* ── Tipologías ── */
.tip-lista {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.tip-lista li {
  font-size: 12px;
  color: #374151;
  padding-left: 10px;
  position: relative;
}
.tip-lista li::before {
  content: "·";
  position: absolute;
  left: 2px;
  color: #9ca3af;
}
/* Tipologías: resumen de una línea, se despliega al hacer clic */
.tip-hidden { display: none; }
.tip-lista { margin-top: 6px; }
.tip-summary {
  background: none;
  border: none;
  color: #1d4ed8;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  padding: 0;
  font-family: inherit;
  white-space: nowrap;
}
.tip-summary:hover { text-decoration: underline; }
.tip-vacia {
  color: #b45309;
  font-size: 12px;
  font-style: italic;
}
/* Badge "aprendido" */
.badge-aprendido {
  display: inline-block;
  margin-left: 6px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .03em;
  color: #0e7490;
  background: #ecfeff;
  border: 1px solid #a5f3fc;
  padding: 1px 7px;
  border-radius: 999px;
  vertical-align: middle;
}

/* ── Estado chips ── */
.estado-chip {
  display: inline-block;
  min-width: 92px;
  padding: 4px 10px;
  border-radius: 14px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  text-align: center;
  box-sizing: border-box;
}
.estado-propuesta { background: #f1f3f5; color: #555; }
.estado-aprobada  { background: #d4edda; color: #1e7e34; }
.estado-rechazada { background: #f8d7da; color: #842029; }

/* ── Acciones ── */
.trd-actions {
  display: flex;
  gap: 5px;
  align-items: center;
  flex-wrap: nowrap;
}

/* ── Incorporar (único color fuera del sistema) ── */
.btn-incorporar             { background: #7c3aed !important; color: white !important; }
.btn-incorporar:hover       { background: #6d28d9 !important; }

/* ── CTA ── */
.premium-cta {
  display: flex;
  justify-content: center;
  margin: 28px 0 24px;
}

/* ── Curación: filtros y lote ── */
.curacion-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.bulk-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  margin-bottom: 12px;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-radius: 10px;
}
.bulk-bar button:disabled {
  opacity: .45;
  cursor: default;
}
.col-chk { width: 34px; text-align: center; }

</style>
</head>

<body>

  <div id="header"></div>

  <main class="module-page">

    <div class="module-header premium-header">
      <h1>TRD-AI – Propuestas de series y subseries</h1>
      <p class="module-subtext">
        El sistema propone series y subseries documentales a partir del análisis
        de actividades identificadas en el módulo ICAF.
      </p>
    </div>

    <div class="module-content">

      <div class="premium-cta" style="gap:10px;flex-wrap:wrap;">
        <button id="btnGenerarPropuestas" class="btn-primary"
          style="min-width:220px;font-weight:600;height:auto;padding:10px 24px;font-size:13px;">
          Generar nuevas propuestas
        </button>
        <button id="btnExportXlsx" class="btn-secondary" style="height:auto;padding:10px 18px;font-size:13px;"
          title="Exportar las propuestas aprobadas como Formato Único de TRD (Excel)">
          ⬇ Exportar Excel
        </button>
        <button id="btnExportDocx" class="btn-secondary" style="height:auto;padding:10px 18px;font-size:13px;"
          title="Exportar las propuestas aprobadas como Formato Único de TRD (Word)">
          ⬇ Exportar Word
        </button>
        <button id="btnValidar" class="btn-secondary" style="height:auto;padding:10px 18px;font-size:13px;"
          title="Revisa la TRD contra reglas del AGN antes de llevarla al comité">
          ✔ Revisar cumplimiento
        </button>
        <button id="btnValorar" class="btn-secondary" style="height:auto;padding:10px 18px;font-size:13px;"
          title="Recalcula retención, disposición y fundamento de las propuestas aprobadas">
          ⚖ Valorar aprobadas
        </button>
        <button id="btnCcdXlsx" class="btn-secondary" style="height:auto;padding:10px 18px;font-size:13px;"
          title="Cuadro de Clasificación Documental codificado (Excel)">
          ⛃ CCD Excel
        </button>
        <button id="btnCcdDocx" class="btn-secondary" style="height:auto;padding:10px 18px;font-size:13px;"
          title="Cuadro de Clasificación Documental codificado (Word)">
          ⛃ CCD Word
        </button>
        <button id="btnReaplicar" class="btn-secondary" style="height:auto;padding:10px 18px;font-size:13px;"
          title="Aplica lo aprendido a las propuestas existentes: limpia tipologías y reasigna series">
          ↻ Re-aplicar aprendizaje
        </button>
      </div>

      <div class="curacion-bar">
        <input id="filtroBusqueda" class="form-control" placeholder="Buscar serie o subserie…" style="max-width:280px;">
        <select id="filtroEstado" class="form-control" style="max-width:180px;">
          <option value="">Todos los estados</option>
          <option value="propuesta">Propuesta</option>
          <option value="aprobada">Aprobada</option>
          <option value="rechazada">Rechazada</option>
          <option value="incorporada">Incorporada</option>
        </select>
        <select id="filtroConfianza" class="form-control" style="max-width:200px;">
          <option value="">Toda confianza</option>
          <option value="baja">Confianza baja (&lt; 70%)</option>
          <option value="alta">Confianza alta (≥ 70%)</option>
        </select>
        <span id="contadorPropuestas" style="margin-left:auto;color:var(--color-text-muted);font-size:13px;"></span>
      </div>

      <div id="bulkBarTrd" class="bulk-bar">
        <span id="bulkCountTrd" style="font-weight:600;color:#1e40af;"></span>
        <div style="margin-left:auto;display:flex;gap:8px;">
          <button id="btnAprobarSel" class="btn-success btn-sm">Aprobar</button>
          <button id="btnRechazarSel" class="btn-danger btn-sm">Rechazar</button>
          <button id="btnFusionarSel" class="btn-secondary btn-sm">Fusionar</button>
          <button id="btnCancelarSel" class="btn-secondary btn-sm">Cancelar</button>
        </div>
      </div>

      <div class="table-container">
        <table class="trd-table">
          <thead>
            <tr>
              <th class="col-chk"><input type="checkbox" id="chkAllTrd" title="Seleccionar todo"></th>
              <th class="col-serie">Serie documental</th>
              <th class="col-subserie">Subserie documental</th>
              <th class="col-cantidad">Act.</th>
              <th class="col-tipos">Tipos documentales</th>
              <th class="col-estado">Estado</th>
              <th class="col-acciones">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaPropuestas"></tbody>
        </table>
      </div>

    </div>

  </main>

  <script type="module" src="/trd-ai/trd-ai-propuestas.js"></script>

</body>
</html>
