<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRD-AI – Propuestas</title>

<link rel="stylesheet" href="/css/core/sipad-ui.css">
<link rel="stylesheet" href="/css/core/notifications.css">

<style>

.module-page { max-width: 1400px !important; }

/* ══════════════════════════════════════════════════════════
   TABLA DE PROPUESTAS · rediseño (agrupada por serie)
   Tokens de marca: --color-primary #0d3f77 · acento dorado
   ══════════════════════════════════════════════════════════ */

.trd-card {
  background: #fff;
  border: 1px solid #e6eaf0;
  border-radius: 14px;
  box-shadow: 0 1px 2px rgba(16,42,73,.06), 0 4px 14px rgba(16,42,73,.05);
  overflow: hidden;
}

.trd-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  font-size: 13px;
}

/* ── Cabecera ── */
.trd-table thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  text-align: left;
  padding: 11px 16px;
  background: #f5f7fb;
  border-bottom: 1px solid #e6eaf0;
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: #64748b;
  white-space: nowrap;
}

/* ── Celdas ── */
.trd-table td {
  padding: 10px 16px;
  border-bottom: 1px solid #eef1f6;
  vertical-align: middle;
}
.trd-table tbody tr.fila:hover td { background: #f9fbfe; }

/* ── Columnas ── */
.col-chk      { width: 38px;  text-align: center; }
.col-subserie { }
.col-cantidad { width: 54px;  text-align: center; color: #64748b; font-variant-numeric: tabular-nums; }
.col-tipos    { width: 210px; }
.col-estado   { width: 132px; text-align: center; }
.col-acciones { width: 214px; }

/* ── Fila de grupo (serie) ── */
tr.grupo td {
  padding: 0;
  background: #f2f6fc;
  border-bottom: 1px solid #e6eaf0;
  border-top: 1px solid #e6eaf0;
}
tr.grupo:first-child td { border-top: none; }
.grupo-inner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  border-left: 3px solid var(--color-primary, #0d3f77);
}
.grupo-chk { width: 22px; display: flex; justify-content: center; }
.grupo-serie {
  font-size: 12.5px;
  font-weight: 800;
  letter-spacing: .03em;
  color: var(--color-primary, #0d3f77);
  text-transform: uppercase;
}
.grupo-meta { font-size: 11.5px; color: #64748b; font-weight: 600; }

/* ── Subserie ── */
.subserie-txt {
  font-weight: 600;
  color: #0f172a;
  text-transform: none;
}
.clamp2 {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
  max-width: 360px;
}

/* ── Tipos documentales: chip discreto que despliega la lista ── */
.tip-summary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #eff4fb;
  border: 1px solid #dbe6f4;
  color: #1e3a8a;
  font-size: 11.5px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}
.tip-summary:hover { background: #e3edfa; }
.tip-lista {
  list-style: none;
  margin: 6px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.tip-lista li {
  font-size: 12px;
  color: #374151;
  padding-left: 12px;
  position: relative;
}
.tip-lista li::before { content: "·"; position: absolute; left: 3px; color: #9ca3af; }
.tip-hidden { display: none; }
.tip-vacia {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #b45309;
  font-size: 11.5px;
  font-weight: 600;
}
.tip-vacia::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #d97706; }

/* Badge "aprendido" */
.badge-aprendido {
  display: inline-block;
  margin-left: 6px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .03em;
  color: #0e7490;
  background: #ecfeff;
  border: 1px solid #a5f3fc;
  padding: 1px 7px;
  border-radius: 999px;
  vertical-align: middle;
}

/* ── Estado: pill con punto ── */
.estado-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 104px;
  justify-content: center;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  border: 1px solid transparent;
  white-space: nowrap;
}
.estado-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; }
.estado-propuesta { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
.estado-propuesta::before { background: #94a3b8; }
.estado-aprobada  { background: #e7f6ec; color: #12864e; border-color: #bfe6cd; }
.estado-aprobada::before { background: #12864e; }
.estado-rechazada { background: #fdeceb; color: #b42318; border-color: #f2c9c4; }
.estado-rechazada::before { background: #b42318; }
.estado-incorporada { background: #e8f0fe; color: #1e40af; border-color: #c7dbfb; }
.estado-incorporada::before { background: #3b82f6; }

/* ── Acciones: botones fantasma (se rellenan al hover) ── */
.trd-actions {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: nowrap;
  vertical-align: middle;
}
.trd-actions .btn-sm {
  height: 30px !important;
  min-height: 0 !important;
  padding: 0 12px !important;
  font-size: 12px !important;
  font-weight: 600 !important;
  border-radius: 8px !important;
  line-height: 1 !important;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid #e6eaf0 !important;
  background: #fff !important;
  color: #475569 !important;
  transition: .12s;
  cursor: pointer;
  margin: 0 !important;
}
.trd-actions .btn-sm:hover { background: #f1f5f9 !important; }
.trd-actions .btn-success {
  color: #12864e !important; border-color: #bfe6cd !important;
}
.trd-actions .btn-success:hover {
  background: #12864e !important; color: #fff !important; border-color: #12864e !important;
}
.trd-actions .btn-danger {
  color: #b42318 !important; border-color: #f2c9c4 !important;
}
.trd-actions .btn-danger:hover {
  background: #b42318 !important; color: #fff !important; border-color: #b42318 !important;
}
.trd-actions .btn-incorporar {
  color: #fff !important; background: var(--color-primary, #0d3f77) !important;
  border-color: var(--color-primary, #0d3f77) !important;
}
.trd-actions .btn-incorporar:hover { background: #0a3260 !important; }

/* ── CTA / barra superior ── */
.premium-cta { display: flex; justify-content: center; margin: 24px 0 18px; }

/* ── Curación: filtros y lote ── */
.curacion-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.bulk-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  margin-bottom: 12px;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-radius: 10px;
}
.bulk-bar button:disabled { opacity: .45; cursor: default; }

</style>
</head>

<body>

  <div id="header"></div>

  <main class="module-page">

    <div class="module-header premium-header">
      <h1>TRD-AI – Propuestas de series y subseries</h1>
      <p class="module-subtext">
        El sistema propone series y subseries documentales a partir del análisis
        de actividades identificadas en el módulo ICAF.
      </p>
    </div>

    <div class="module-content">

      <div class="premium-cta" style="gap:10px;flex-wrap:wrap;">
        <button id="btnGenerarPropuestas" class="btn-primary"
          style="min-width:220px;font-weight:600;height:auto;padding:10px 24px;font-size:13px;">
          Generar nuevas propuestas
        </button>
        <button id="btnBiblioteca" class="btn-secondary" style="height:auto;padding:10px 18px;font-size:13px;"
          title="Precarga una estructura base de series y subseries por tipo de entidad (arranca del 80%)">
          ⚑ Biblioteca de referencia
        </button>
        <button id="btnExportXlsx" class="btn-secondary" style="height:auto;padding:10px 18px;font-size:13px;"
          title="Exportar las propuestas aprobadas como Formato Único de TRD (Excel)">
          ⬇ Exportar Excel
        </button>
        <button id="btnExportDocx" class="btn-secondary" style="height:auto;padding:10px 18px;font-size:13px;"
          title="Exportar las propuestas aprobadas como Formato Único de TRD (Word)">
          ⬇ Exportar Word
        </button>
        <button id="btnValidar" class="btn-secondary" style="height:auto;padding:10px 18px;font-size:13px;"
          title="Revisa la TRD contra reglas del AGN antes de llevarla al comité">
          ✔ Revisar cumplimiento
        </button>
        <button id="btnValorar" class="btn-secondary" style="height:auto;padding:10px 18px;font-size:13px;"
          title="Recalcula retención, disposición y fundamento de las propuestas aprobadas">
          ⚖ Valorar aprobadas
        </button>
        <button id="btnCcdXlsx" class="btn-secondary" style="height:auto;padding:10px 18px;font-size:13px;"
          title="Cuadro de Clasificación Documental codificado (Excel)">
          ⛃ CCD Excel
        </button>
        <button id="btnCcdDocx" class="btn-secondary" style="height:auto;padding:10px 18px;font-size:13px;"
          title="Cuadro de Clasificación Documental codificado (Word)">
          ⛃ CCD Word
        </button>
        <button id="btnReaplicar" class="btn-secondary" style="height:auto;padding:10px 18px;font-size:13px;"
          title="Aplica lo aprendido a las propuestas existentes: limpia tipologías y reasigna series">
          ↻ Re-aplicar aprendizaje
        </button>
      </div>

      <div class="curacion-bar">
        <input id="filtroBusqueda" class="form-control" placeholder="Buscar serie o subserie…" style="max-width:280px;">
        <select id="filtroEstado" class="form-control" style="max-width:180px;">
          <option value="">Todos los estados</option>
          <option value="propuesta">Propuesta</option>
          <option value="aprobada">Aprobada</option>
          <option value="rechazada">Rechazada</option>
          <option value="incorporada">Incorporada</option>
        </select>
        <select id="filtroConfianza" class="form-control" style="max-width:200px;">
          <option value="">Toda confianza</option>
          <option value="baja">Confianza baja (&lt; 70%)</option>
          <option value="alta">Confianza alta (≥ 70%)</option>
        </select>
        <span id="contadorPropuestas" style="margin-left:auto;color:var(--color-text-muted);font-size:13px;"></span>
      </div>

      <div id="bulkBarTrd" class="bulk-bar">
        <span id="bulkCountTrd" style="font-weight:600;color:#1e40af;"></span>
        <div style="margin-left:auto;display:flex;gap:8px;">
          <button id="btnAprobarSel" class="btn-success btn-sm">Aprobar</button>
          <button id="btnRechazarSel" class="btn-danger btn-sm">Rechazar</button>
          <button id="btnFusionarSel" class="btn-secondary btn-sm">Fusionar</button>
          <button id="btnCancelarSel" class="btn-secondary btn-sm">Cancelar</button>
        </div>
      </div>

      <div class="trd-card">
        <table class="trd-table">
          <thead>
            <tr>
              <th class="col-chk"><input type="checkbox" id="chkAllTrd" title="Seleccionar todo"></th>
              <th class="col-subserie">Subserie documental</th>
              <th class="col-cantidad">Act.</th>
              <th class="col-tipos">Tipos documentales</th>
              <th class="col-estado">Estado</th>
              <th class="col-acciones">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaPropuestas"></tbody>
        </table>
      </div>

    </div>

  </main>

  <script type="module" src="/trd-ai/trd-ai-propuestas.js"></script>

</body>
</html>
