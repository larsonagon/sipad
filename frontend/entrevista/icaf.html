<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICAF para firma – SIPAD</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef1f5; color: #000; font: 12px/1.4 Arial, Helvetica, sans-serif; }
  .barra { position: sticky; top: 0; z-index: 2; background: #0d3f77; color: #fff; display: flex; gap: 10px; justify-content: space-between; align-items: center; padding: 10px 16px; font-size: 13px; }
  .barra button { font: inherit; font-weight: 700; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: #fff; color: #0d3f77; }
  .barra select { font: inherit; border-radius: 8px; padding: 7px 8px; border: none; max-width: 50vw; }
  .barra .acc { display: flex; gap: 8px; align-items: center; }
  /* Hoja: mismo diseño del ICAF oficial (segtec.pdf.service.js) */
  .hoja { background: #fff; max-width: 794px; margin: 18px auto; padding: 40px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .hoja + .hoja { page-break-before: always; break-before: page; }
  h1 { text-align: center; font-size: 18px; margin: 0 0 15px; }
  h2 { font-size: 14px; margin-top: 25px; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
  .campo { margin-bottom: 10px; break-inside: avoid; }
  .label { font-weight: bold; margin-bottom: 3px; }
  .box { border: 1px solid #ccc; padding: 8px; min-height: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid .campo { margin-bottom: 0; }
  .firma { margin-top: 60px; text-align: center; break-inside: avoid; }
  .linea { width: 300px; border-top: 2px solid #000; margin: 40px auto 10px auto; }
  .firma-nombre { font-weight: bold; }
  .firma-cargo { font-size: 11px; color: #444; }
  .footer { margin-top: 40px; border-top: 1px solid #ccc; padding-top: 8px; font-size: 10px; color: #666; display: flex; justify-content: space-between; gap: 12px; }
  .error { max-width: 600px; margin: 40px auto; background: #fff; padding: 20px; border-radius: 10px; font-size: 13px; }
  @media (max-width: 640px) { .hoja { padding: 20px 16px; } .grid { grid-template-columns: 1fr; } }
  @media print {
    body { background: #fff; } .barra, .barra-aviso { display: none; }
    .hoja { box-shadow: none; margin: 0; max-width: none; padding: 0; }
    @page { size: A4; margin: 40px 40px 60px; }
  }
</style>
</head>
<body>
  <div class="barra"><span>ICAF diligenciado por entrevista</span><div class="acc"><select id="quien" aria-label="Funcionario"></select><button type="button" id="imprimir">Imprimir o guardar PDF</button></div></div>
  <div id="acta"></div>
  <script type="module" src="/entrevista/icaf.js"></script>
</body>
</html>
